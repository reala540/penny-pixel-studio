[project]
name = "studio"
version = "2.4.0"
description = "AI Content Studio engine: research, scripts, video, publishing"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "psycopg[binary]>=3.2",
  "pyyaml>=6",
  "pillow>=10",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "soundfile>=0.12",
  "kokoro-onnx>=0.4",
  "cryptography>=42",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
studio = "studio.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["studio*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "db: needs a PostgreSQL database (STUDIO_TEST_DB_URL)",
  "media: renders real audio/video (needs ffmpeg and Kokoro model files)",
]
