# Non-AI services: limits, costs and safety switches. All values are editable estimates —
# verify on each provider's site. The app never upgrades anything to a paid plan.

budgets:
  x_api:
    monthly_cap_usd: 1.00          # owner-approved maximum
    cost_per_post_usd: 0.015       # verify on X's pricing page
    cost_per_post_with_url_usd: 0.20
    allow_links: false             # links are blocked to keep cost down
    hard_stop: true

quotas:
  youtube_data_api:
    daily_units: 10000
    upload_units: 1600
    thumbnail_units: 50
    search_units: 100
  github_actions:
    monthly_minutes: 2000          # private repo, GitHub Free
    reserve_minutes: 200           # never plan past this safety margin
  supabase:
    region: eu-central-1           # used to reach the Session pooler if a direct (IPv6-only) address is given
    storage_bytes: 1073741824      # 1 GB
    database_bytes: 524288000      # 500 MB
    storage_reserve_fraction: 0.2
  cloudflare_workers_ai:
    daily_neurons: 10000

retention:
  preview_days_after_decision: 7
  failed_asset_days: 3
  master_artifact_days: 14          # GitHub artifact retention for final renders
  recipe: forever                   # recipes are small and can rebuild any video

render:
  long:
    width: 1920
    height: 1080
    fps: 30
    crf: 23
    preset: veryfast
  short:
    width: 1080
    height: 1920
    fps: 30
    crf: 23
    preset: veryfast
  preview:
    long: { width: 854, height: 480, crf: 30 }
    short: { width: 480, height: 854, crf: 30 }
  min_long_minutes: 8                # long videos: 8-14 minutes, aiming for about 11
  target_long_minutes: 11
  max_long_minutes: 14
  max_short_seconds: 58
  stock_video: alternate   # stock scenes that try a real video clip first: off | alternate | always
  animated_max_long: 4     # original animated scenes per long video (the rest keep still visuals)
  animated_max_short: 1

# Auto Review & Post only ever approves low-risk packages ("Smart Mode"). See engine/studio/review/auto.py.
smart_mode:
  trust_period: { ai: 0, money: 10 }   # packages you approve yourself before the studio may approve any for you (Pixel: none, owner's choice)

publishing:
  ai_disclosure:
    # must stay true whoever approves: Smart Mode can approve low-risk videos without a person
    description_line: "Narrated with an AI voice. Researched with AI tools; every fact is checked against the sources listed above."
    label_synthetic_media: false   # set true if a video shows realistic AI-generated people, places or events
  youtube:
    api_audited: false      # until Google's audit passes, API uploads are locked to private
    category_id: "27"       # Education (fallback)
    category_ids: { ai: "28", money: "27" }   # Pixel: Science & Technology; Penny: Education
    default_language: "en"
  tiktok:
    direct_post_approved: false   # until TikTok audit passes, use inbox drafts
  facebook:
    graph_version: "v23.0"
  x:
    enabled: true
