# The five social accounts and their weekly targets. Targets are goals, not quotas:
# quality checks and the capacity planner can reduce them.

timezone: "Africa/Nairobi"

accounts:
  - platform: youtube
    label: "YouTube AI"
    channel: ai
    topic_mix: { ai: 1.0, money: 0.0 }
    weekly_targets: { long_video: 3, short_video: 6 }
    posting_days: ["mon", "wed", "fri"]
    posting_times: ["18:00"]
    shorts_days: ["mon", "tue", "wed", "thu", "fri", "sat"]
    shorts_times: ["12:00"]
  - platform: youtube
    label: "YouTube Money"
    channel: money
    topic_mix: { ai: 0.0, money: 1.0 }
    weekly_targets: { long_video: 3, short_video: 6 }
    posting_days: ["tue", "thu", "sat"]
    posting_times: ["18:00"]
    shorts_days: ["mon", "tue", "wed", "thu", "fri", "sat"]
    shorts_times: ["15:00"]
  - platform: facebook
    label: "Facebook Page"
    channel: null
    topic_mix: { ai: 0.5, money: 0.5 }
    weekly_targets: { reel: 3, text_post: 2 }
    posting_days: ["mon", "wed", "fri", "sat", "sun"]
    posting_times: ["12:30"]
  - platform: tiktok
    label: "TikTok"
    channel: null
    topic_mix: { ai: 0.5, money: 0.5 }
    weekly_targets: { short_video: 3 }
    posting_days: ["tue", "thu", "sun"]
    posting_times: ["19:30"]
  - platform: x
    label: "X"
    channel: null
    topic_mix: { ai: 0.5, money: 0.5 }
    weekly_targets: { text_post: 3 }
    posting_days: ["mon", "wed", "fri"]
    posting_times: ["08:30"]
