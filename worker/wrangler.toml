name = "penny-pixel-studio"
main = "src/index.ts"
compatibility_date = "2025-09-01"

# Every 15 minutes: wake GitHub Actions only when a post is due or the owner queued a job.
[triggers]
crons = ["*/15 * * * *"]

[vars]
SUPABASE_URL = ""            # e.g. https://abcd.supabase.co
DASHBOARD_URL = ""           # e.g. https://penny-pixel.pages.dev
GITHUB_REPO = ""             # e.g. yourname/ai-content-studio
GITHUB_REF = "main"

# Secrets (set with `npx wrangler secret put NAME`, never in this file):
#   SUPABASE_SERVICE_ROLE_KEY, SUPABASE_ANON_KEY, TOKEN_ENCRYPTION_KEY, GITHUB_TOKEN,
#   TELEGRAM_BOT_TOKEN, TELEGRAM_WEBHOOK_SECRET,
#   GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, FACEBOOK_APP_ID, FACEBOOK_APP_SECRET,
#   TIKTOK_CLIENT_KEY, TIKTOK_CLIENT_SECRET, X_CLIENT_ID, X_CLIENT_SECRET
