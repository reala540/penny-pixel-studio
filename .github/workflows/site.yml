# Generated layout: every workflow gets the same secrets (unset ones are simply empty).
name: Website

# The public Penny & Pixel website: plain files built from approved, published videos and uploaded to Cloudflare
# Pages. Runs after each publishing run and once a day. It reads the studio's database but the website itself has no
# login, no database and no keys.
on:
  push:
    branches: [main]
    paths: ['engine/studio/website/**', 'config/**', 'supabase/migrations/**', '.github/workflows/site.yml']
  workflow_run:
    workflows: ["Publish due posts"]
    types: [completed]
  schedule:
    - cron: "23 4 * * *"  # 07:23 in Nairobi
  workflow_dispatch:

concurrency:
  group: studio-website
  cancel-in-progress: false

permissions:
  contents: read

env:
  SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
  MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  AION_API_KEY: ${{ secrets.AION_API_KEY }}
  OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
  ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
  CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
  SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
  YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
  FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
  SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
  PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
  FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
  PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
  GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
  GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
  TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
  TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
  X_CLIENT_ID: ${{ secrets.X_CLIENT_ID }}
  X_CLIENT_SECRET: ${{ secrets.X_CLIENT_SECRET }}
  DASHBOARD_URL: ${{ vars.DASHBOARD_URL || 'https://dashboard-beta-ten-13.vercel.app' }}

  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  SITE_URL: ${{ vars.SITE_URL }}
  SITE_PROJECT: ${{ vars.SITE_PROJECT || 'pennyandpixel' }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - id: setup
        uses: ./.github/actions/setup-engine
        timeout-minutes: 14
        continue-on-error: true
      - if: steps.setup.outcome != 'success'
        uses: ./.github/actions/setup-engine
        timeout-minutes: 14
      - name: Build the website
        run: studio site --out site_out
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Upload to Cloudflare Pages
        working-directory: worker
        run: |
          npm ci
          # the project is created the first time; afterwards this just says it exists
          npx wrangler pages project create "$SITE_PROJECT" --production-branch main || true
          npx wrangler pages deploy ../site_out --project-name "$SITE_PROJECT" --branch main --commit-dirty=true || {
            echo "::error::Cloudflare refused the upload. Most often the CLOUDFLARE_API_TOKEN needs the 'Cloudflare Pages: Edit' permission (Cloudflare dashboard -> My Profile -> API Tokens -> edit the token)."
            exit 1; }
