name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine:
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest moves to 26.04, which broke the backup step
    timeout-minutes: 55
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      STUDIO_TEST_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - id: setup                # a stuck download gives up after 14 minutes and is tried once more
        uses: ./.github/actions/setup-engine
        timeout-minutes: 14
        continue-on-error: true
      - if: steps.setup.outcome != 'success'
        uses: ./.github/actions/setup-engine
        timeout-minutes: 14
      - run: pip install -q pytest
      - run: cd engine && pytest -q

  worker:
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest moves to 26.04, which broke the backup step
    timeout-minutes: 10
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run

  dashboard:
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest moves to 26.04, which broke the backup step
    timeout-minutes: 10
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # The dashboard in a real browser against simulated services (no real database, platform or AI is called):
  # every page in normal and failing conditions, approvals, drafts, schedules, settings and the clocks.
  browser:
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest moves to 26.04, which broke the backup step
    timeout-minutes: 25
    defaults:
      run:
        working-directory: dashboard
    env:
      E2E_SCREENSHOT_DIR: /tmp/studio-screenshots
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Every page, normal and failing data
        run: node e2e/sweep.mjs
      - run: node e2e/audit.mjs
      - run: node e2e/phase1.mjs
      - run: node e2e/phase2.mjs
      - run: node e2e/reliability.mjs
      - run: node e2e/clock.mjs
      - run: node e2e/quality.mjs
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-screenshots
          path: /tmp/studio-screenshots
          retention-days: 7
